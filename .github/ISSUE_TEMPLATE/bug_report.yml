name: Bug report
description: A tool fails or returns wrong data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste an Indico token. Remove it from configurations and logs.
  - type: input
    id: indico
    attributes:
      label: Indico server and version
      description: The version is shown at the bottom of every Indico page.
      placeholder: https://indico.example.org, Indico 3.3.6
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: indico-mcp version or commit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The tool, its arguments, the error message, and what you expected.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: The INDICO_* variables you set, without tokens.
